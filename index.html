<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Young Woo Song — AI Builder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/theme.css">
</head>
<body>

<!-- Cosmic background stage -->
<div id="cosmic-stage" aria-hidden="true">
  <canvas id="cosmic-canvas"></canvas>
  <div class="scanline"></div>
  <div class="vignette"></div>
</div>

<!-- Scroll progress bar -->
<div class="scroll-progress"><div class="bar" id="scroll-bar"></div></div>

<!-- Hover preview thumbnail (used by editorial list) -->
<div class="work-preview" id="work-preview">
  <div class="preview-frame"><span id="preview-frame-l">FRAME 01</span><span id="preview-frame-r">— —</span></div>
  <div class="preview-inner"><img id="preview-img" alt="" /><span class="preview-mark" id="preview-mark">⟁</span></div>
  <div class="preview-meta"><span class="pm-cat" id="preview-cat">CATEGORY</span><span class="pm-tag" id="preview-tag">VIEW →</span></div>
</div>

<div id="app"></div>

<!-- Libraries -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Cosmic stage: particle field (vanilla) -->
<script src="cosmic.js"></script>

<!-- Data + Tweaks panel + App -->
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
